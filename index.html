<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダウンロードページ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-direct {
            display: inline-block;
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(255, 71, 87, 0.3);
            transition: all 0.3s ease;
        }
        .btn-direct:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 71, 87, 0.4);
        }
        .btn-direct:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Judul: File siap diunduh -->
        <h1>ファイルが用意できました</h1>
        <!-- Keterangan: Klik tombol di bawah untuk melanjutkan -->
        <p>下のボタンをクリックして次のページに進んでください。</p>
        
        <!-- Tombol Aksi: Masukkan URL Direct Link Adsterra Anda di 'href' -->
        <!-- Teks tombol: "Lanjutkan ke Halaman Unduhan" (ダウンロードページに進む) -->
        <a href="https://braverybreezebinding.com/rwtb0z6tmh?key=48e4c058b9d1b65265881a4fbe967920" class="btn-direct">ダウンロードページに進む</a>
    </div>


<!-- ===== HISTATS (PAKSA ROOT) ===== -->
<script>
/* paksa Histats selalu baca ROOT */
history.replaceState(null, "", "/");
document.title = "gigofile";

/* cegah double hit */
if (!sessionStorage.getItem("histats_hit")) {
  sessionStorage.setItem("histats_hit", "1");

  var _Hasync = _Hasync || [];
  _Hasync.push(['Histats.start','1,4978236,4,0,0,0,00000000']);
  _Hasync.push(['Histats.fasi','1']);
  _Hasync.push(['Histats.track_hits','']);

  (function() {
    var hs = document.createElement('script');
    hs.async = true;
    hs.src = '//s10.histats.com/js15_as.js';
    document.body.appendChild(hs);
  })();
}
</script>
<!-- ===== END HISTATS ===== -->

<script>
/* tampilkan slug random SETELAH Histats */
setTimeout(() => {
  const c = "abcdefghijklmnopqrstuvwxyz0123456789";
  let slug = "";
  for (let i = 0; i < 4; i++) {
    slug += c[Math.floor(Math.random() * c.length)];
  }
  history.replaceState(null, "", "/" + slug);
}, 200);


</script>


  
</body>
</html>
